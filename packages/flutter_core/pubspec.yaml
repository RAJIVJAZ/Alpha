name: foodgrid_core
description: Shared foundation for the FoodGrid Flutter apps — API client, session, theme, formatting, widgets, live tracking.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.5
  flutter: '>=1.17.0'

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

