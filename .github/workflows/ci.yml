name: CI

on:
  pull_request:
  push:
    branches: [main]

# a new push to a pull request supersedes its running checks; main keeps one run per
# commit because a green run there is what triggers CD (cd.yml) for that commit
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: static
      - name: Format
        run: pnpm format:check
      # report lint and type errors even when formatting already failed
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck
      # CD deploys infrastructure/kubernetes/base as committed; it must match its generator
      # (gateway:routes first: k8s:generate copies the nginx config it writes)
      - name: Generated files are up to date
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm gateway:routes
          pnpm k8s:generate
          paths=(infrastructure/gateway infrastructure/docker/nginx infrastructure/kubernetes/base)
          if [[ -n $(git status --porcelain -- "${paths[@]}") ]]; then
            git status --short -- "${paths[@]}"
            git diff -- "${paths[@]}"
            echo "::error::Run pnpm gateway:routes and pnpm k8s:generate, then commit the result"
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: unit
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # same images as infrastructure/docker/docker-compose.yml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodgrid
          POSTGRES_PASSWORD: foodgrid
          POSTGRES_DB: foodgrid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodgrid -d foodgrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # setupTestEnv (@foodgrid/utils/testing) points every e2e suite at TEST_DATABASE_URL and
      # TEST_REDIS_URL and sets the keys and secrets the services validate at boot;
      # DATABASE_URL is what `prisma migrate deploy` migrates
      DATABASE_URL: postgresql://foodgrid:foodgrid@localhost:5432/foodgrid_test
      TEST_DATABASE_URL: postgresql://foodgrid:foodgrid@localhost:5432/foodgrid_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: integration
      - name: Apply migrations
        run: pnpm db:deploy
      # Turborepo's strict env mode only passes the variables declared in turbo.json, which
      # would drop TEST_*; loose mode passes the job env through to the suites
      - name: Integration tests
        run: pnpm test:integration --env-mode=loose

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: build
      - run: pnpm build

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # one image per Dockerfile; CD builds and pushes all 19 from the same files
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: order-service
            dockerfile: service.Dockerfile
            build-args: |
              SERVICE=order-service
              PORT=4003
          - image: customer-web
            dockerfile: web.Dockerfile
            build-args: APP=customer-web
          - image: migrate
            dockerfile: migrate.Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          tags: foodgrid/${{ matrix.image }}:ci
          # build only: the result stays in the builder cache
          outputs: type=cacheonly
          # read the layers CD cached on main; nothing is written from here
          cache-from: type=gha,scope=${{ matrix.image }}

  ci-ok:
    name: CI result
    # a single stable check for branch protection, whatever the matrix contains
    if: ${{ always() }}
    needs: [static, unit, integration, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::Some CI jobs did not pass: ${NEEDS}"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs.*.result) }}
