name: Terraform

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.5
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infrastructure/terraform

  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, global, envs/staging, envs/production]
    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform init -backend=false
      - run: terraform validate -no-color

  plan:
    name: Plan ${{ matrix.root }}
    needs: [fmt, validate]
    # only with the optional read-only role, and never for forks (no OIDC token there)
    if: >-
      github.event_name == 'pull_request' &&
      vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # bootstrap keeps local state; global is planned too since it holds the IAM/OIDC trust
        root: [global, envs/staging, envs/production]
    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init with the S3 backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          [[ -n $TF_STATE_BUCKET ]] || {
            echo "::error::Set the TF_STATE_BUCKET repository variable (terraform output in bootstrap)"
            exit 1
          }
          # the init_command bootstrap outputs: the stacks' backend blocks hold the rest
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
      # -lock=false: the plan role is read-only and cannot write the S3 lock file
      - name: Plan
        env:
          ROOT: ${{ matrix.root }}
        run: |
          status=0
          terraform plan -lock=false -no-color -detailed-exitcode -out=tfplan > plan.log 2>&1 || status=$?
          cat plan.log
          # -detailed-exitcode: 0 no changes, 2 changes present, anything else is an error
          if [[ $status -ne 0 && $status -ne 2 ]]; then
            echo "::error::terraform plan failed for $ROOT"
            exit "$status"
          fi
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan: \`$ROOT\`"
            echo
            grep -E '^(Plan:|No changes\.|Changes to Outputs:)' plan.log || echo 'See the job log.'
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            # job summaries are capped at 1 MiB per step
            head -c 60000 plan.txt
            echo
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
