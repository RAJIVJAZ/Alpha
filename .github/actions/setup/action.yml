name: Set up the workspace
description: >-
  pnpm (the version pinned by packageManager in package.json), Node from .nvmrc with the pnpm
  store cache, a frozen-lockfile install and the generated Prisma client. Optionally restores
  and saves the Turborepo local cache.

inputs:
  turbo-cache:
    description: >-
      Name for this job's .turbo/cache entry (keyed on the lockfile and commit, restoring the
      newest earlier entry); empty skips the Turborepo cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # no version input: it reads packageManager from package.json
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - if: inputs.turbo-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate the Prisma client
      shell: bash
      run: pnpm db:generate
