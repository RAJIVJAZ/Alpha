name: merchant_mobile
description: "FoodGrid Business: live orders, kitchen display, menu, inventory, procurement and POS for restaurant and food-cart teams."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  foodgrid_core:
    path: ../../packages/flutter_core
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  intl: ^0.20.3
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dio: ^5.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
