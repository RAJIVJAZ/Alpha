# Prometheus Operator (kube-prometheus-stack) scrapes every FoodGrid service's /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: foodgrid-services
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: service
      app.kubernetes.io/part-of: foodgrid
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # the service label the apps set (auth-service, order-service, …) is kept as-is
      honorLabels: true
