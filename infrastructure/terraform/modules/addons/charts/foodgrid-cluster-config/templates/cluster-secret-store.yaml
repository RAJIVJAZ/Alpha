# Read by the ExternalSecrets in infrastructure/kubernetes (foodgrid-secrets,
# foodgrid-auth-secrets, foodgrid-payment-secrets). No auth block: the External
# Secrets controller uses its own IRSA role, which may only read
# foodgrid/<env>/* in this environment.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: foodgrid
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
spec:
  # only the application namespace may use the store
  conditions:
    - namespaces:
        - '{{ .Values.appNamespace }}'
  provider:
    aws:
      service: SecretsManager
      region: '{{ .Values.region }}'
