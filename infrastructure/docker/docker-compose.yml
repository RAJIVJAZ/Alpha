# The whole FoodGrid stack in containers: Postgres, Redis, MinIO (S3), the 12
# services, the nginx API gateway and the 6 web apps.
#
#   cp .env.example .env && pnpm keys:generate      # once: JWT signing keys
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build
#   docker compose -f infrastructure/docker/docker-compose.yml run --rm seed   # optional demo data
#
# Gateway http://localhost:8080 · customer :3000 · admin :3001 · restaurant :3002
# supplier :3003 · rider :3004 · vendor :3005 · MinIO console :9001
name: foodgrid

x-service-build: &service-build
  context: ../..
  dockerfile: infrastructure/docker/service.Dockerfile

x-web-build: &web-build
  context: ../..
  dockerfile: infrastructure/docker/web.Dockerfile

x-service-env: &service-env
  # local stack: OTP codes are returned by the API and SMS/push/email go to the logs
  NODE_ENV: ${FOODGRID_NODE_ENV:-development}
  OTP_EXPOSE_IN_RESPONSE: ${OTP_EXPOSE_IN_RESPONSE:-true}
  DATABASE_URL: postgresql://foodgrid:foodgrid@postgres:5432/foodgrid?schema=public
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  S3_MEDIA_BUCKET: foodgrid-media-local
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  CDN_BASE_URL: http://localhost:${MINIO_PORT:-9000}/foodgrid-media-local
  CUSTOMER_WEB_URL: http://localhost:${CUSTOMER_WEB_PORT:-3000}
  AUTH_SERVICE_URL: http://auth-service:4001
  USER_SERVICE_URL: http://user-service:4002
  ORDER_SERVICE_URL: http://order-service:4003
  PAYMENT_SERVICE_URL: http://payment-service:4004
  INVENTORY_SERVICE_URL: http://inventory-service:4005
  PROCUREMENT_SERVICE_URL: http://procurement-service:4006
  DELIVERY_SERVICE_URL: http://delivery-service:4007
  SUPPLIER_SERVICE_URL: http://supplier-service:4008
  ANALYTICS_SERVICE_URL: http://analytics-service:4009
  ADS_SERVICE_URL: http://ads-service:4010
  NOTIFICATION_SERVICE_URL: http://notification-service:4011
  AI_SERVICE_URL: http://ai-service:4012

x-service: &service
  restart: unless-stopped
  # JWT keys, secrets and provider settings; the environment block below wins
  env_file:
    - path: ../../.env
      required: false
  environment: *service-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

x-web: &web
  restart: unless-stopped
  environment:
    API_URL: http://gateway:8080/api/v1
    GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
  depends_on:
    gateway: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodgrid
      POSTGRES_PASSWORD: foodgrid
      POSTGRES_DB: foodgrid
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodgrid -d foodgrid"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # media bucket with public reads (menu photos, delivery proof thumbnails)
  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["sh", "-c"]
    command:
      - mc alias set local http://minio:9000 minioadmin minioadmin
        && mc mb --ignore-existing local/foodgrid-media-local
        && mc anonymous set download local/foodgrid-media-local

  migrate:
    build: { context: ../.., dockerfile: infrastructure/docker/migrate.Dockerfile }
    image: foodgrid/migrate:${TAG:-local}
    environment:
      DATABASE_URL: postgresql://foodgrid:foodgrid@postgres:5432/foodgrid?schema=public
    depends_on: { postgres: { condition: service_healthy } }

  seed:
    image: foodgrid/migrate:${TAG:-local}
    profiles: [seed]
    command: ["db:seed", "--", "--reset"]
    environment:
      DATABASE_URL: postgresql://foodgrid:foodgrid@postgres:5432/foodgrid?schema=public
    depends_on: { migrate: { condition: service_completed_successfully } }

  auth-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: auth-service, PORT: "4001" } }
    image: foodgrid/auth-service:${TAG:-local}
  user-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: user-service, PORT: "4002" } }
    image: foodgrid/user-service:${TAG:-local}
  order-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: order-service, PORT: "4003" } }
    image: foodgrid/order-service:${TAG:-local}
  payment-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: payment-service, PORT: "4004" } }
    image: foodgrid/payment-service:${TAG:-local}
  inventory-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: inventory-service, PORT: "4005" } }
    image: foodgrid/inventory-service:${TAG:-local}
  procurement-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: procurement-service, PORT: "4006" } }
    image: foodgrid/procurement-service:${TAG:-local}
  delivery-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: delivery-service, PORT: "4007" } }
    image: foodgrid/delivery-service:${TAG:-local}
  supplier-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: supplier-service, PORT: "4008" } }
    image: foodgrid/supplier-service:${TAG:-local}
  analytics-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: analytics-service, PORT: "4009" } }
    image: foodgrid/analytics-service:${TAG:-local}
  ads-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: ads-service, PORT: "4010" } }
    image: foodgrid/ads-service:${TAG:-local}
  notification-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: notification-service, PORT: "4011" } }
    image: foodgrid/notification-service:${TAG:-local}
  ai-service:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: ai-service, PORT: "4012" } }
    image: foodgrid/ai-service:${TAG:-local}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      [auth-service, user-service, order-service, payment-service, inventory-service, procurement-service,
       delivery-service, supplier-service, analytics-service, ads-service, notification-service, ai-service]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      retries: 20

  customer-web:
    <<: *web
    build: { <<: *web-build, args: { APP: customer-web } }
    image: foodgrid/customer-web:${TAG:-local}
    ports: ["${CUSTOMER_WEB_PORT:-3000}:3000"]
  admin-web:
    <<: *web
    build: { <<: *web-build, args: { APP: admin-web } }
    image: foodgrid/admin-web:${TAG:-local}
    ports: ["${ADMIN_WEB_PORT:-3001}:3000"]
  restaurant-web:
    <<: *web
    build: { <<: *web-build, args: { APP: restaurant-web } }
    image: foodgrid/restaurant-web:${TAG:-local}
    ports: ["${RESTAURANT_WEB_PORT:-3002}:3000"]
  supplier-web:
    <<: *web
    build: { <<: *web-build, args: { APP: supplier-web } }
    image: foodgrid/supplier-web:${TAG:-local}
    ports: ["${SUPPLIER_WEB_PORT:-3003}:3000"]
  rider-web:
    <<: *web
    build: { <<: *web-build, args: { APP: rider-web } }
    image: foodgrid/rider-web:${TAG:-local}
    ports: ["${RIDER_WEB_PORT:-3004}:3000"]
  vendor-web:
    <<: *web
    build: { <<: *web-build, args: { APP: vendor-web } }
    image: foodgrid/vendor-web:${TAG:-local}
    ports: ["${VENDOR_WEB_PORT:-3005}:3000"]

volumes:
  postgres:
  redis:
  minio:
